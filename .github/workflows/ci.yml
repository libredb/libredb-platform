name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  db-tests:
    name: Database Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 15 is the minimum supported version, because the bridge views use the security_invoker reloption.
        postgres: ['15', '18']
    env:
      TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:db
      # Fails (exit code 2) when prisma/schema.prisma has changes that no migration in prisma/migrations holds.
      # It empties the shadow database first, so it passes on every run and not only on a fresh database.
      - name: Drift check
        env:
          SHADOW_DATABASE_URL: postgresql://libredb_owner:libredb_owner_dev@127.0.0.1:55432/libredb_shadow
        run: npm run db:drift
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  integration:
    name: Integration Tests (Keycloak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: docker compose -f docker-compose.test.yml up -d --wait keycloak keycloak-proxied
      - run: npm run test:integration
      - if: failure()
        run: docker compose -f docker-compose.test.yml logs keycloak keycloak-proxied
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  e2e-self-hosted:
    name: E2E Tests (self-hosted)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      # Every later step, the server and the Playwright run read the self-hosted environment.
      - name: Load the self-hosted environment
        run: grep -Ev '^(#|$)' e2e/self-hosted/platform.env >> "$GITHUB_ENV"
      - run: docker compose -f docker-compose.test.yml up -d --wait postgres keycloak
      # MIGRATE_DATABASE_URL connects as the owner role, and the self-hosted seed creates the install tenant.
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      # The server and the Playwright run need PLATFORM_LICENSE: the CI license, which the repository secret
      # LIBREDB_E2E_LICENSE holds, a license that the production keys verify for localhost, with 1 admin seat and 3 user
      # seats. It is written after the install and the build, so their scripts never read it, and each of the two
      # commands below reads it into its own environment alone.
      - name: Write the CI license to a file
        env:
          LIBREDB_E2E_LICENSE: ${{ secrets.LIBREDB_E2E_LICENSE }}
        run: |
          if [ -z "$LIBREDB_E2E_LICENSE" ]; then
            echo "::error::The secret LIBREDB_E2E_LICENSE is not set, and the self-hosted end-to-end tests run Platform with the CI license that it holds"
            exit 1
          fi
          umask 077
          printf '%s' "$LIBREDB_E2E_LICENSE" > "$RUNNER_TEMP/libredb-e2e.license"
          echo "LIBREDB_E2E_LICENSE_FILE=$RUNNER_TEMP/libredb-e2e.license" >> "$GITHUB_ENV"
      - name: Start Platform on port 3100
        run: |
          PLATFORM_LICENSE="$(cat "$LIBREDB_E2E_LICENSE_FILE")" npx next start -p 3100 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/login && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      - run: PLATFORM_LICENSE="$(cat "$LIBREDB_E2E_LICENSE_FILE")" npm run test:e2e:self-hosted
      - if: failure()
        run: |
          cat next-start.log
          docker compose -f docker-compose.test.yml logs keycloak
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-self-hosted
          path: test-results/
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Builds the runner image and runs every subcommand against PostgreSQL over verified TLS, with Keycloak for maintain.
      - run: scripts/ci/docker-smoke.sh
