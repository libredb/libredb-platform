name: Installer Nightly

# The acceptance runs of the installer before a customer install, in Docker mode: the convergence matrix (a clean run
# and a re-run converge with a managed or an external PostgreSQL and Keycloak), the independence of Platform and Studio
# (each keeps serving while the other stops), and the network egress (nothing on the libredb networks sends a packet
# to a non-private address). A scheduled run checks out the default branch.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Converge ${{ matrix.combination }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The fixtures under installer/test/fixtures/configs/matrix/: a managed or external PostgreSQL with a managed or
        # external Keycloak.
        combination:
          - managed-pg-managed-kc
          - external-pg-managed-kc
          - managed-pg-external-kc
          - external-pg-external-kc
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # A Studio chart pinned as git:<sha> is built from that Studio commit, so check it out next to the repo.
      - name: Read the pinned Studio chart commit
        id: studio
        run: echo "commit=$(jq -r '.studioChart.version | select(startswith("git:")) | ltrimstr("git:")' release/release.config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.studio.outputs.commit != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: libredb/libredb-studio
          ref: ${{ steps.studio.outputs.commit }}
          path: studio-src
      - name: Build the installer binary
        run: bun run build
        env:
          LIBREDB_STUDIO_REPO: ${{ github.workspace }}/studio-src
      - name: Resolve the test hostnames to this runner
        run: echo "127.0.0.1 platform.libredb.test studio.libredb.test auth.libredb.test" | sudo tee -a /etc/hosts
      # Every install of the end-to-end tests names LIBREDB_E2E_LICENSE_FILE, the file of the CI license, which the
      # repository secret LIBREDB_E2E_LICENSE holds: a license that the pinned Platform image verifies for
      # platform.libredb.test and lab.libredb.test, with 1 admin seat and 3 user seats.
      - name: Write the CI license to a file
        env:
          LIBREDB_E2E_LICENSE: ${{ secrets.LIBREDB_E2E_LICENSE }}
        run: |
          if [ -z "$LIBREDB_E2E_LICENSE" ]; then
            echo "::error::The secret LIBREDB_E2E_LICENSE is not set, and every install of the convergence matrix uses the CI license that it holds"
            exit 1
          fi
          umask 077
          printf '%s' "$LIBREDB_E2E_LICENSE" > "$RUNNER_TEMP/libredb-e2e.license"
          echo "LIBREDB_E2E_LICENSE_FILE=$RUNNER_TEMP/libredb-e2e.license" >> "$GITHUB_ENV"
      # Each combination installs from nothing, applies, verifies, applies again with No changes and verifies again.
      # sudo resets the environment, so the command passes LIBREDB_E2E_LICENSE_FILE on to the test itself.
      - name: Converge the combination as root
        run: sudo env "LIBREDB_E2E_MATRIX=$LIBREDB_E2E_MATRIX" "LIBREDB_E2E_LICENSE_FILE=$LIBREDB_E2E_LICENSE_FILE" "$(command -v bun)" test test/e2e/matrix.test.ts
        env:
          LIBREDB_E2E_MATRIX: ${{ matrix.combination }}
      - name: Show the installer state and logs
        if: failure()
        run: |
          sudo ./dist/libredb-installer-linux-x64 status || true
          sudo sh -c 'cat /opt/libredb/logs/*.log' || true
          sudo docker compose -p libredb logs --no-color || true
          sudo docker logs libredb-e2e-external-pg || true
          sudo docker logs libredb-e2e-corp-keycloak || true

  egress-and-independence:
    name: Egress and independence
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Read the pinned Studio chart commit
        id: studio
        run: echo "commit=$(jq -r '.studioChart.version | select(startswith("git:")) | ltrimstr("git:")' release/release.config.json)" >> "$GITHUB_OUTPUT"
      - if: steps.studio.outputs.commit != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: libredb/libredb-studio
          ref: ${{ steps.studio.outputs.commit }}
          path: studio-src
      - name: Build the installer binary
        run: bun run build
        env:
          LIBREDB_STUDIO_REPO: ${{ github.workspace }}/studio-src
      - name: Resolve the test hostnames to this runner
        run: echo "127.0.0.1 platform.libredb.test studio.libredb.test auth.libredb.test" | sudo tee -a /etc/hosts
      # The browser specs run next to the containers they stop and start, and Chromium fails the requests in flight with
      # ERR_NETWORK_CHANGED whenever an address of this runner changes: a container's start gives this runner's end of
      # its veth an IPv6 link-local address once duplicate address detection ends, about 1.6 s later, and its stop
      # removes it. Interfaces created from here on get no link-local address.
      - name: Keep container starts and stops from changing the runner's addresses
        run: sudo sysctl -w net.ipv6.conf.default.addr_gen_mode=1
      - name: Install Chromium for the browser specs
        run: bunx playwright install --with-deps chromium
      # The install of the egress test names LIBREDB_E2E_LICENSE_FILE, the file of the CI license, as in the matrix job.
      - name: Write the CI license to a file
        env:
          LIBREDB_E2E_LICENSE: ${{ secrets.LIBREDB_E2E_LICENSE }}
        run: |
          if [ -z "$LIBREDB_E2E_LICENSE" ]; then
            echo "::error::The secret LIBREDB_E2E_LICENSE is not set, and the install of the egress test uses the CI license that it holds"
            exit 1
          fi
          umask 077
          printf '%s' "$LIBREDB_E2E_LICENSE" > "$RUNNER_TEMP/libredb-e2e.license"
          echo "LIBREDB_E2E_LICENSE_FILE=$RUNNER_TEMP/libredb-e2e.license" >> "$GITHUB_ENV"
      # The images are pulled before the iptables rules count and drop every packet from the libredb networks to a
      # non-private address; apply, verify and the interop suite then run, and the counter must stay at 0. The interop
      # suite runs as root inside the test, after the first admin's first login that --project=hostnames runs before it,
      # with the runner's Chromium and its results outside the checkout.
      - name: Check the network egress as root
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "LIBREDB_E2E_INTEROP_COMMAND=bunx playwright test --config e2e/playwright.config.ts --project=hostnames --output $RUNNER_TEMP/interop-results interop.spec.ts" \
            "LIBREDB_E2E_LICENSE_FILE=$LIBREDB_E2E_LICENSE_FILE" "$(command -v bun)" test test/e2e/egress.test.ts
      # The installation the egress test leaves: each app stops while the other keeps serving and starts again. The spec
      # signs in as the first admin with the account that the first login of the egress step saved as root, so it runs as
      # root as well, and --no-deps skips that first login, which the installation no longer offers.
      - name: Check that Platform and Studio work without each other
        run: |
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            bunx playwright test --config e2e/playwright.config.ts --project=hostnames --no-deps --output "$RUNNER_TEMP/independence-results" independence.spec.ts
      - name: Show the installer state and logs
        if: failure()
        run: |
          sudo ./dist/libredb-installer-linux-x64 status || true
          sudo sh -c 'cat /opt/libredb/logs/*.log' || true
          sudo docker compose -p libredb logs --no-color || true
