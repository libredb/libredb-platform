apiVersion: install.libredb.org/v1
kind: LibreDBInstallation
metadata:
  name: acme
mode: docker
endpoints:
  style: hostnames
  hosts:
    platform: platform.libredb.test
    studio: studio.libredb.test
    auth: auth.libredb.test
tls:
  mode: generated
postgres:
  mode: managed
keycloak:
  mode: managed
  realm: libredb
  adminPort: 18080
  firstAdmin:
    enabled: true
    username: libredb-admin
  userManager:
    enabled: true
    username: libredb-user-manager
platform:
  organizationName: Acme Corp
  licenseFile: /etc/libredb/platform.license
backups:
  enabled: true
bridge:
  sealKeys:
    issueNew: false
    retire: []
docker:
  systemdUnit: false
