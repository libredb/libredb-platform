# The convergence matrix of the nightly run (test/e2e/matrix.test.ts): Docker mode with a managed PostgreSQL and a
# managed Keycloak, on the three .test hostnames.
apiVersion: install.libredb.org/v1
kind: LibreDBInstallation
metadata:
  name: matrix-managed-pg-managed-kc
mode: docker
endpoints:
  hosts:
    platform: platform.libredb.test
    studio: studio.libredb.test
    auth: auth.libredb.test
tls:
  mode: generated
postgres:
  mode: managed
keycloak:
  mode: managed
platform:
  organizationName: LibreDB E2E
docker:
  systemdUnit: false
