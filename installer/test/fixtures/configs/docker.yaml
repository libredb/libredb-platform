# The Docker configuration of the end-to-end tests: the three .test hostnames, a managed PostgreSQL and a managed
# Keycloak. A variant gets a fixture of its own or applies --set overrides to this one.
apiVersion: install.libredb.org/v1
kind: LibreDBInstallation
metadata:
  name: e2e
mode: docker
endpoints:
  hosts:
    platform: platform.libredb.test
    studio: studio.libredb.test
    auth: auth.libredb.test
tls:
  mode: generated
postgres:
  mode: managed
keycloak:
  mode: managed
platform:
  organizationName: LibreDB E2E
docker:
  systemdUnit: false
