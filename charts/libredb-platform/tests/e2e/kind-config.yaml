# The kind cluster of the end-to-end test: Traefik's node ports reach the host on 127.0.0.1:80 and 127.0.0.1:443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: libredb-helm
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
